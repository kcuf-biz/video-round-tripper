# Publishes @kcuf.biz/video-round-tripper to npm when a version tag is pushed (v0.1.1, ...).
# Pushing the tag is the human act; this job holds no npm token. npm trusts this workflow by
# name ("trusted publishing", set on the package's npmjs.com settings page), so it signs in
# with GitHub's OIDC token. Provenance is only attached once the repo is public.
name: Publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Tag matches the package version
        run: |
          v=$(node -p "require('./roundtrip/package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but package is $v"; exit 1; }
      - run: npm run typecheck
      - run: npm test
      # prepublishOnly runs build:lib; prepack checks the README copy and swaps exports.
      - run: npm publish --access public
        working-directory: roundtrip
