# Tests, typecheck, and the library and demo builds on every push and pull request.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:lib
      # Packing runs pack-exports.mjs, which refuses when roundtrip/README.md has drifted from
      # README.md. Checked here so drift fails a push, not the next release.
      - run: npm pack --dry-run -w roundtrip
      - run: npm run build
