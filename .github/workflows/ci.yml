# Tests, typecheck, and the library and demo builds on every push and pull request.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:lib
      # The package ships a copy of README.md (npm reads it before any pack script runs), and
      # packing refuses when the copy has drifted. Sync it first so a README edit never fails a
      # push; the publish workflow syncs it the same way before releasing.
      - run: cp README.md roundtrip/README.md
      - run: npm pack --dry-run -w roundtrip
      - run: npm run build
